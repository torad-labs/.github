# ---
# ORG-REQUIRED WORKFLOW — enforced by the `torad-standards` org ruleset.
#
# This file is not called by anything and has no caller to sync. The ruleset
# runs it against every targeted repo directly, which is why the repo it lives
# in matters: a required workflow may only run on repos of the SAME OR NARROWER
# visibility. This repo is PUBLIC, so this gate reaches public and private
# repos alike. Storing it in the private github-operator would silently limit it
# to private repos and leave the public ones — the very ones a leaked secret
# hurts most — uncovered.
# ---
# Two passes, because one is provably not enough.
#
#   1. gitleaks over the FULL history. Full history on purpose: a secret that was
#      committed and later removed is still leaked, and the tip would not show it.
#   2. a supplementary pattern pass for the classes gitleaks' default ruleset
#      does not cover.
#
# Pass 2 exists because of a measured failure, not a hunch. On 2026-07-31 a fleet
# scan found a LIVE Cloudflare Workers-AI token in torad's history — and sitting
# one line above it, a LIVE Neo4j database password that gitleaks did NOT flag.
# Both were rotated. Pass 2's patterns are what found the second one.
#
# Adopted org-wide 2026-07-30 after an audit found secret scanning present in
# only 6 of 24 repos — including gateward, which had none.
name: org-secret-scan

# Ruleset-required workflows are only ever triggered by pull_request and
# merge_group. Any other trigger here would never fire.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: org-secret-scan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the tip
          persist-credentials: false
      - name: gitleaks (fail on any committed secret)
        env:
          GITLEAKS_VERSION: 'v8.21.2'
        run: |
          # Pass --config explicitly so repo allowlists in .gitleaks.toml apply.
          docker run --rm -v "$PWD:/repo" -w /repo "ghcr.io/gitleaks/gitleaks:${GITLEAKS_VERSION}" \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  # Classes gitleaks' defaults miss. Scoped to the PR's changed files so it stays
  # fast and so pre-existing history does not block unrelated work — history is
  # pass 1's job.
  supplementary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Patterns gitleaks does not cover
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A credential-ish NAME assigned a LITERAL value (>=15 chars). Excludes
          # $VAR, ${VAR} and <placeholder> so env indirection never trips it.
          ASSIGN='(PASSWORD|PASSWD|SECRET|API_?KEY|AUTH_?TOKEN|ACCESS_?TOKEN|PRIVATE_?KEY|CLIENT_?SECRET|DB_?PASS)[A-Za-z_]*["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][^"'"'"'$<{[:space:]][^"'"'"']{15,}["'"'"']'
          # scheme://user:password@host — the shape that hid a live Neo4j password.
          CONN='[a-z][a-z0-9+.-]{2,}://[A-Za-z0-9_.-]+:[^:@/[:space:]"'"'"'$<]{8,}@'
          PEM='-----BEGIN ([A-Z ]+ )?PRIVATE KEY-----'
          # Pure SCREAMING_SNAKE values are the conventional placeholder shape
          # (YOUR_API_KEY, REDACTED_NEO4J_PASSWORD, CHANGE_ME). Real credentials
          # are mixed-case or contain punctuation, so this costs no recall.
          PLACEHOLDER='[:=][[:space:]]*["'"'"'][A-Z][A-Z0-9_]{10,}["'"'"']'

          if [ -n "${BASE_SHA:-}" ]; then
            files=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA")
          else
            files=$(git ls-files)
          fi
          [ -n "$files" ] || { echo "No files to scan."; exit 0; }

          bad=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.zip|*.jar|*.so|*.bin|*.apk|*.wasm|*.lock) continue ;;
            esac
            if hits=$(grep -nIE -e "$ASSIGN" -e "$CONN" -e "$PEM" "$f" 2>/dev/null \
                      | grep -vE "$PLACEHOLDER" || true); [ -n "$hits" ]; then
              # A repo may carry .gitleaksignore-style exemptions for this pass in
              # .github/secret-scan-allow.txt (one extended-regex per line).
              allow=.github/secret-scan-allow.txt
              if [ -f "$allow" ]; then
                hits=$(printf '%s\n' "$hits" | grep -vEf "$allow" || true)
              fi
              if [ -n "$hits" ]; then
                bad=1
                echo "::error file=$f::possible credential (pattern pass)"
                printf '%s\n' "$hits" | cut -c1-160 | sed "s|^|  $f: |"
              fi
            fi
          done <<< "$files"

          if [ "$bad" -ne 0 ]; then
            echo "::error::Supplementary pass found credential-shaped content gitleaks' defaults do not cover."
            echo "If it is a false positive, add a narrow regex to .github/secret-scan-allow.txt with a comment saying why."
            exit 1
          fi
          echo "Supplementary pattern pass: clean."
