# ---
# ORG-REQUIRED WORKFLOW — enforced by the `torad-standards` org ruleset.
#
# Lives in this PUBLIC repo so it can run on public and private repos alike;
# a required workflow may only run on repos of the same or narrower visibility.
# See org-secret-scan.yml for the full reasoning.
#
# Source of truth: torad-labs/github-operator templates/org-workflow-lint.yml.
# Operator sync delivers this self-contained workflow to the public org repo.
# ---
# zizmor catches credential leakage, template injection, excessive permissions
# and cache poisoning; actionlint catches expression/type/shellcheck errors that
# zizmor ignores. This pair earns its place: zizmor caught a live unsound
# ternary in the operator's own poller where `cond && '' || '--flag'` always
# yielded the false branch, so a dry run would have dispatched for real.
#
# Adopted org-wide 2026-07-30 after an audit found workflow static analysis in
# only 5 of 24 repos.
name: org-workflow-lint

# Ruleset-required workflows are only ever triggered by pull_request and
# merge_group. NOTE: no `paths:` filter — a required workflow that is skipped
# by a path filter never reports its check, and the PR waits forever on a check
# that will not arrive. Both jobs are short and exit immediately when a repo
# has no workflows.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: org-workflow-lint-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    # ubuntu-slim: 1 vCPU, 5 GB, no Docker, a 15-minute cap. This job needs none of
    # what it lacks, and bills a third of ubuntu-latest's rate.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        run: |
          if compgen -G '.github/workflows/*.y*ml' > /dev/null; then
            echo "has-workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .github/workflows to analyse." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ steps.probe.outputs.has-workflows == 'true' }}
      # Scope is .github/ — NOT the repo root. GitHub only ever executes
      # workflows from .github/workflows/ at the top level, but `zizmor .`
      # recurses into vendored trees: qgre-engine-labs carries the cudarc crate
      # with its own .github/workflows, and the gate was failing on upstream's
      # files, which never run here and cannot be fixed without conflicting on
      # every vendor update.
      # Two passes on purpose. Bare `zizmor` exits non-zero on ANY finding, down
      # to Informational — which made this gate fail a repo whose worst finding
      # was "consider a longer Dependabot cooldown". A gate that blocks on
      # advisory notices trains people to ignore it, so:
      #
      #   report  — every finding as a PR annotation, never fails
      #   gate    — High severity only, and that is the pass/fail
      #
      # Calibrated against the fleet: gateward's real cache-poisoning finding is
      # High and still fails here; torad's 4 Medium + 1 Low + 2 Informational
      # correctly do not.
      - name: Report all findings (advisory)
        if: ${{ steps.probe.outputs.has-workflows == 'true' }}
        continue-on-error: true
        env:
          ZIZMOR_VERSION: '1.28.0'
        run: uvx "zizmor@${ZIZMOR_VERSION}" --format github .github/

      - name: Fail on high-severity findings
        if: ${{ steps.probe.outputs.has-workflows == 'true' }}
        env:
          ZIZMOR_VERSION: '1.28.0'
        run: uvx "zizmor@${ZIZMOR_VERSION}" --min-severity high --format plain .github/

  actionlint:
    # Native pinned analyzers retain shell/Python coverage without a Docker daemon.
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        run: |
          if compgen -G '.github/workflows/*.y*ml' > /dev/null; then
            echo "has-workflows=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .github/workflows to analyse." >> "$GITHUB_STEP_SUMMARY"
          fi
        shell: bash
      - name: Install pinned native workflow linters
        run: |
          set -euo pipefail
          compgen -G '.github/workflows/*.y*ml' >/dev/null || exit 0
          actionlint_dir="$(mktemp -d "$RUNNER_TEMP/actionlint.XXXXXX")"
          shellcheck_dir="$(mktemp -d "$RUNNER_TEMP/shellcheck.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/archive.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$actionlint_dir/archive.tar.gz" | sha256sum --check --status
          tar -xzf "$actionlint_dir/archive.tar.gz" -C "$actionlint_dir" actionlint
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            --output "$shellcheck_dir/archive.tar.xz"
          printf '%s  %s\n' 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198 "$shellcheck_dir/archive.tar.xz" | sha256sum --check --status
          tar -xJf "$shellcheck_dir/archive.tar.xz" -C "$shellcheck_dir" --strip-components=1 shellcheck-v0.11.0/shellcheck
          # Match the former Docker action's Python checks, not just YAML and shell.
          python3 -I -m venv "$RUNNER_TEMP/native-lint-python"
          printf '%s\n' 'pyflakes==3.4.0 --hash=sha256:f742a7dbd0d9cb9ea41e9a24a918996e8170c799fa528688d40dd582c8265f4f --hash=sha256:b24f96fafb7d2ab0ec5075b7350b3d2d2218eab42003821c06344973d3ea2f58' > "$RUNNER_TEMP/native-lint-python/requirements.txt"
          "$RUNNER_TEMP/native-lint-python/bin/python" -I -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/native-lint-python/requirements.txt"
          printf '%s\n' "$actionlint_dir" "$shellcheck_dir" "$RUNNER_TEMP/native-lint-python/bin" >> "$GITHUB_PATH"
      - name: Lint workflows without Docker
        run: |
          set -euo pipefail
          compgen -G '.github/workflows/*.y*ml' >/dev/null || exit 0
          for tool in actionlint shellcheck pyflakes; do
            command -v "$tool" >/dev/null || { echo "::error::missing required analyzer $tool"; exit 1; }
          done
          status=0
          actionlint -oneline > "$RUNNER_TEMP/actionlint.out" || status=$?
          cat "$RUNNER_TEMP/actionlint.out"
          # Preserve reviewdog's existing fail_level:error contract: print all
          # findings, but shellcheck warning/info/note findings stay advisory.
          python3 -I - "$RUNNER_TEMP/actionlint.out" "$status" <<'PY'
          import pathlib, re, sys
          lines = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.strip()]
          status = int(sys.argv[2])
          if status not in (0, 1) or (status != 0 and not lines):
              raise SystemExit(1)
          def is_error(line):
              level = re.search(r" shellcheck reported issue in this script: [^:]*:([ewin])", line)
              return level is None or level.group(1) == "e"
          raise SystemExit(1 if any(is_error(line) for line in lines) else 0)
          PY
